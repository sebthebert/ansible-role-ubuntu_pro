---
- name: Install ca-certificates package
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    update_cache: true
  become: true

- name: Install Ubuntu Pro client package
  ansible.builtin.apt:
    name: "{{ ubuntu_pro_package }}"
    state: present
  become: true
  vars:
    ubuntu_pro_package: >-
      {{ 'ubuntu-advantage-tools' if ansible_facts.lsb.release is version('22.04', '<') else 'ubuntu-pro-client' }}
